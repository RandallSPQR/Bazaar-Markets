[project]
name = "bazaar-markets"
version = "1.0.0"
description = "Deterministic market-simulation engine for studying deceptive advertising and AI agents"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "jsonschema>=4.20"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["engine", "agents", "cli"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
