<title id="t">Patrolling’s edge over fixed posts, by how far sellers can recognize a uniform</title>
<desc id="d">Small multiples: patrolling minus posts at five recognition ranges, with 95% intervals over 30 paired seeds; the table in the summary gives every value.</desc>
<text class="t" x="30" y="40" font-size="20">Patrolling’s edge over fixed posts, by how far sellers can recognize a uniform</text>
