<rect class="bg" x="0" y="0" width="900" height="620"/>
<title id="t">Best bust-out gain against enforcement intensity, collectible and judgment-proof</title>
<desc id="d">Mean gain with intervals at detect_scale 0 to 1, by liability arm and verification level. The summary gives every value.</desc>
<text class="t" x="30" y="44" font-size="20">Best bust-out gain against enforcement intensity, collectible and judgment-proof</text>
<text class="s" x="30" y="70" font-size="14">Collectible: fined at the catch, no exit. Judgment-proof: fines due 3 days later; the stall exits 1 or 3 days after busting out.</text>
<text class="n" x="30" y="564">Bazaar engine 0.15.0. Seeds 230-249 paired; 95% t-intervals, unadjusted; 3 sampled genuine stalls per seed; 30 days; 2 patrolling inspectors.</text>
<text class="n" x="30" y="580">Gain = the sampled stall's collected 30-day profit at its best candidate minus never busting out (unfloored). detect_scale multiplies every catch probability;</text>
<text class="n" x="30" y="596">x on a square-root scale. Choice-set demand (m 3), 150 buyers, budget 1.25 × base, bargain hunters 0.2, naive deceptive sellers, fresh reopening, premium 0.4.</text>
<text class="lb" x="130" y="108">tourist share 0.4, locals inspect</text>
