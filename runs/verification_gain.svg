<text class="lb" x="436.0" y="184.5" text-anchor="start">locals inspect</text>
<polyline class="hlc" fill="none" points="134.0,381.8 284.0,346.7 434.0,192.5"/>
<line class="hlc" x1="134.0" y1="391.0" x2="134.0" y2="372.6"/>
<circle class="hl" cx="134.0" cy="381.8" r="3.5"/>
<line class="hlc" x1="284.0" y1="364.5" x2="284.0" y2="328.8"/>
<circle class="hl" cx="284.0" cy="346.7" r="3.5"/>
<line class="hlc" x1="434.0" y1="236.7" x2="434.0" y2="148.3"/>
