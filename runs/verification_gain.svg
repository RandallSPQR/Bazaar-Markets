<style>.bg{fill:#fffff8} .t{font-family:"ET Book", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;fill:#111} .s{font-family:"ET Book", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;fill:#666} .k{font-family:system-ui,-apple-system,sans-serif;fill:#999;font-size:11px} .n{font-family:system-ui,-apple-system,sans-serif;fill:#aaa;font-size:10.5px} .lb{font-family:"ET Book", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;font-size:12.5px;fill:#333} .ax{stroke:#ccc;stroke-width:1} .zero{stroke:#bbb;stroke-width:1;stroke-dasharray:3 3} .ln{stroke:#666;stroke-width:1.6;fill:none} .ci{stroke:#666;stroke-width:1.2} .pt{fill:#666} .hl{fill:#e15759} .hlc{stroke:#e15759;stroke-width:1.4} .bar{fill:#7a7a7a} .bar31{fill:#bbb} .med{stroke:#e15759;stroke-width:1.4} .medt{fill:#e15759} .an{font-family:"ET Book", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;font-style:italic;font-size:12px;fill:#333} @media (prefers-color-scheme: dark){.bg{fill:#151515} .t{fill:#ddd} .s{fill:#999} .k{fill:#888} .n{fill:#666} .lb{fill:#bbb} .ax{stroke:#444} .zero{stroke:#555} .ln{stroke:#aaa} .ci{stroke:#aaa} .pt{fill:#aaa} .hl{fill:#fc8d62} .hlc{stroke:#fc8d62} .bar{fill:#999} .bar31{fill:#555} .med{stroke:#fc8d62} .medt{fill:#fc8d62} .an{fill:#bbb}}</style>
<rect class="bg" x="0" y="0" width="900" height="620"/>
<title id="t">Best bust-out gain against tourist share, with and without local inspection</title>
<desc id="d">Mean gain with intervals at tourist shares 0.4, 0.7 and 1.0, local inspection on and off. The summary gives every value.</desc>
<text class="t" x="30" y="44" font-size="20">Best bust-out gain against tourist share, with and without local inspection</text>
<text class="s" x="30" y="70" font-size="14">Stage A: no inspectors; stage B: 2 patrolling inspectors. Experts always inspect.</text>
<text class="n" x="30" y="564">Bazaar engine 0.13.0. Seeds 200-219 paired; 95% t-intervals, unadjusted; 3 sampled genuine stalls per seed; bust-out days 20, 25, 28, 29, 30; 30 days.</text>
<text class="n" x="30" y="580">Gain = the sampled stall's 30-day profit at its best bust-out day minus never busting out. Choice-set demand (m 3, gamma 0), 150 buyers, budget 1.25 × base,</text>
<text class="n" x="30" y="596">bargain hunters 0.2 (Q_req 0.15–0.40), naive deceptive sellers, fresh reopening, premium 0.4 (placeholder). Locals and experts split the non-tourists evenly.</text>
<text class="lb" x="130" y="108">stage A: no inspectors</text>
