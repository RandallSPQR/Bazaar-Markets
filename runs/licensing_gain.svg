<title id="t">Owner's gain from licensing the brand, against busting out</title>
<desc id="d">Mean owner gain with intervals per condition, licensing and bust-out, by verification level. The summary gives every value.</desc>
<text class="t" x="30" y="44" font-size="20">Owner's gain from licensing the brand, against busting out</text>
<text class="s" x="30" y="70" font-size="14">Best option minus never (unfloored); licensing options N ∈ {2, 6} licensees from day 10 or 20</text>
<text class="n" x="30" y="668">Bazaar engine 0.16.0. Seeds 250-269 paired; 95% t-intervals, unadjusted; 3 sampled genuine owners per seed; 30 days; 2 patrolling inspectors; royalty 0.15.</text>
<text class="n" x="30" y="684">Cheap licensees: low true quality, claim the brand's quality, deceptive policy. Contract licensees: the owner's quality. Bust-out candidates: day 20, 25, 28, 29, 30.</text>
<text class="n" x="30" y="700">Highlighted: the confirmatory cell (PX1, PX2). Choice-set demand (m 3), 150 buyers, budget 1.25 × base, premium 0.4, naive deceptive sellers, fresh reopening.</text>
