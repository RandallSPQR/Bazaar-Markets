<title id="t">Which bust-out candidate is best, by condition</title>
<desc id="d">Counts of best candidates per condition and liability arm. The summary gives every value.</desc>
<text class="t" x="30" y="44" font-size="20">Which bust-out candidate is best, by condition</text>
<text class="s" x="30" y="70" font-size="14">Stall-seeds whose best candidate (unfloored) is each one; “never” = how many would rather not bust out</text>
<text class="n" x="30" y="554">Bazaar engine 0.15.0. Seeds 230-249 paired; 95% t-intervals, unadjusted; 3 sampled genuine stalls per seed; 30 days; 2 patrolling inspectors.</text>
