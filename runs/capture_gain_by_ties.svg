<title id="t">Best bust-out gain against critics' ties, with and without embarrassment</title>
<desc id="d">Mean gain with paired intervals at tie shares 0, 0.3, 0.6, embarrassment off and on, for inspector capture 0 and 0.5. The summary gives every value.</desc>
<text class="t" x="30" y="44" font-size="20">Best bust-out gain against critics' ties, with and without embarrassment</text>
<text class="s" x="30" y="70" font-size="14">Stage B: 2 patrolling inspectors, 4 critics; panels by inspector capture; PK1 slope −0.02 [−1.00, +0.97] per +0.1 tie share</text>
<text class="n" x="30" y="560">Bazaar engine 0.11.0. Seeds 52–66 paired; 95% t-intervals, unadjusted; 3 sampled genuine stalls per seed; bust-out days 10, 20, 27; 30 days.</text>
