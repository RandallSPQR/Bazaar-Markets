<rect class="bg" x="0" y="0" width="900" height="600"/>
<title id="t">Best bust-out gain against rating memory, by tourist share</title>
<desc id="d">Mean gain with paired intervals at lambda 0.7, 0.9, 0.97 for tourist shares 0.4 and 0.8. The summary gives every value.</desc>
<text class="t" x="30" y="44" font-size="20">Best bust-out gain against rating memory, by tourist share</text>
<text class="s" x="30" y="70" font-size="14">Stage A, no inspectors or critics; PS1 slope +16.59 [−0.60, +33.78] per +0.1 of λ</text>
<text class="n" x="30" y="544">Bazaar engine 0.11.0. Seeds 52–66 paired; 95% t-intervals, unadjusted; 3 sampled genuine stalls per seed; bust-out days 10, 20, 27; 30 days.</text>
<line class="zero" x1="130.0" y1="194.3" x2="730.0" y2="194.3"/>
<text class="n" x="30" y="560">Gain = the sampled stall's 30-day profit at its best bust-out day minus never busting out. Budget 1.25 × base, 150 buyers, search depth 2, fresh reopening,</text>
<text class="n" x="30" y="576">naive deceptive sellers, premium 0.4 (placeholder). Ratings visible to locals and experts only.</text>
