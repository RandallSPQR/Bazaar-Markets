<title id="t">Who pays when a brand cashes out: change by buyer profile</title>
<desc id="d">Dots with paired intervals per profile and stage. The summary gives every value.</desc>
<text class="t" x="30" y="44" font-size="20">Who pays when a brand cashes out: change by buyer profile</text>
<text class="s" x="30" y="70" font-size="14">Sampled stall busting out at its best day minus nobody busting out, days from the bust-out to 30; pooled over each stage's conditions</text>
<text class="n" x="30" y="520">Bazaar engine 0.11.0. Seeds 52–66 paired; 95% t-intervals, unadjusted; 3 sampled genuine stalls per seed; bust-out days 10, 20, 27; 30 days.</text>
<text class="n" x="30" y="536">Surplus = value − price − inspection costs, per buyer of the profile present those days. Gray: stage A; accent: stage B.</text>
<text class="t" x="150" y="110" font-size="15">shortfall share of purchases, points</text>
