<title id="t">How fast the brand's rating falls after licensing</title>
<desc id="d">Brand rating by day, by licensing option and verification level. The summary gives every value.</desc>
<text class="t" x="30" y="44" font-size="20">How fast the brand's rating falls after licensing</text>
<text class="s" x="30" y="70" font-size="14">Mean brand rating by day over the sampled owners; cheap licensees, detect_scale 1, owner not liable</text>
<text class="n" x="30" y="564">Bazaar engine 0.16.0. Seeds 250-269 paired; 95% t-intervals, unadjusted; 3 sampled genuine owners per seed; 30 days; 2 patrolling inspectors; royalty 0.15.</text>
<text class="n" x="30" y="580">Rating = memory-weighted share of rated units whose true quality met the claim (memory 0.7); unrated drawn at 0.5.</text>
<text class="n" x="30" y="596">Grey: never licensing. Dashed: contract licensees (6 from day 10). N×b = N licensees from day b.</text>
<text class="lb" x="110" y="108">tourist share 0.4, locals inspect</text>
